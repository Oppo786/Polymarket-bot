version: '3.8'

services:
  polymarket-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-btc5m-trader
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TRADING_MODE=${TRADING_MODE:-DRY_RUN}
      - POLYMARKET_PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY:-}
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY:-}
      - POLYMARKET_API_SECRET=${POLYMARKET_API_SECRET:-}
      - POLYMARKET_API_PASSPHRASE=${POLYMARKET_API_PASSPHRASE:-}
      - POLYMARKET_FUNDER_ADDRESS=${POLYMARKET_FUNDER_ADDRESS:-}
      - POLYMARKET_SIGNATURE_TYPE=${POLYMARKET_SIGNATURE_TYPE:-0}
      - POLYMARKET_CHAIN_ID=${POLYMARKET_CHAIN_ID:-137}
      - POLYMARKET_CLOB_HOST=${POLYMARKET_CLOB_HOST:-https://clob.polymarket.com}
      - POLYMARKET_GAMMA_HOST=${POLYMARKET_GAMMA_HOST:-https://gamma-api.polymarket.com}
      - POLYMARKET_WS_HOST=${POLYMARKET_WS_HOST:-wss://ws-subscriptions-clob.polymarket.com/ws/market}
      - DASHBOARD_AUTH_PASSWORD=${DASHBOARD_AUTH_PASSWORD:-}
      - DATABASE_PATH=/app/data/trader.sqlite
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
